name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify generated website
        run: python3 scripts/build_site.py --check
      - name: Test display selection
        run: swift test
      - name: Build universal app
        run: ./scripts/build.sh --universal
      - name: Check app bundle
        run: |
          lipo -archs dist/Dimlet.app/Contents/MacOS/Dimlet
          codesign --verify --deep --strict dist/Dimlet.app
          plutil -lint dist/Dimlet.app/Contents/Info.plist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Dimlet-macos-universal
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
