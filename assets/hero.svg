<text x="167" y="99" text-anchor="middle" font-size="14" font-weight="600" fill="#706085">A tiny macOS friend</text>
<text x="76" y="227" font-size="100" font-weight="750" letter-spacing="-5" fill="#34304A">Dimlet</text>
<text x="80" y="298" font-size="33" font-weight="600" letter-spacing="-.8" fill="#34304A">Screens rest.</text>
<text x="80" y="343" font-size="33" font-weight="600" letter-spacing="-.8" fill="#34304A">Your Mac keeps going.</text>
<text x="80" y="400" font-size="19" fill="#777086">Black out your external displays.</text>
<text x="80" y="429" font-size="19" fill="#777086">Keep your work — and your charging — going.*</text>
<text x="80" y="510" font-size="14" fill="#777086">FREE &amp; OPEN SOURCE  ·  NATIVE SWIFT  ·  NO ACCOUNT</text>
<text x="80" y="551" font-size="12" fill="#8C8497">* Black overlays, not power-off. USB-C charging depends on your setup.</text>
</g>
